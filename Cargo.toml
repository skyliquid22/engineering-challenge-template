[package]
name = "engineering-challenge"
version = "0.1.0"
edition = "2024"
build = "src/util/build.rs"

[dependencies]
anyhow = "1"
base64 = "0.23.1"
chrono = "0.4"
crossbeam = "0.8.4"
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "pem"] }
rand = "0.8"
rsa = { version = "0.9.10", features = ["sha2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
tempfile = "3"

[build-dependencies]
ergo-sbe = "=0.1.16"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.9"
